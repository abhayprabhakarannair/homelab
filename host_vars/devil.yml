wol: "{{ secrets.wol.devil }}"

ufw_rules:
  - {port: "22", proto: tcp, comment: SSH}
  - {port: "1714:1764", proto: tcp, from_ip: "{{ lan_cidr }}", comment: KDE Connect}
  - {port: "1714:1764", proto: udp, from_ip: "{{ lan_cidr }}", comment: KDE Connect}
  - {port: "{{ imp.ota_port }}", proto: tcp, from_ip: "{{ lan_cidr }}", comment: imp OTA}

ufw_superseded_apps: [SSH, KDE Connect]

warden_modules: [power, system, sensors]
