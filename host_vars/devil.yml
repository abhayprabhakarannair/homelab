wol: "{{ secrets.wol.devil }}"

ufw_rules:
  - {port: "22", proto: tcp, comment: SSH, state: absent}  # Tailscale SSH needs no open port
  - {port: "1714:1764", proto: tcp, from_ip: "{{ lan_cidr }}", comment: KDE Connect}
  - {port: "1714:1764", proto: udp, from_ip: "{{ lan_cidr }}", comment: KDE Connect}

ufw_superseded_apps: [SSH, KDE Connect]

warden_modules: [power, system, sensors, ups]
warden_ups: "{{ ups.name }}@localhost"
warden_disks: [/, /mnt/data]

ups:
  name: apc
  desc: APC Back-UPS RS 1500G-IN
  vendorid: "051d"
  productid: "0002"
  low_charge_pct: 30
  low_runtime_s: 300
