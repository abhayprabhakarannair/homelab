# Ordered failover: first entry is primary. MACs are the stock firmware's per-port WAN MACs. `sqm` shapes a link
# with cake at these rates (kbit/s, ~90 % of measured); a link without it is not shaped.
wans:
  - {name: bsnl, device: wan1, macaddr: "98:03:8e:71:9d:ba", interval: 1}
  - {name: railwire, device: lan2, macaddr: "98:03:8e:71:9d:bb", interval: 1}
  - {name: jio, device: lan3, macaddr: "98:03:8e:71:9d:bc", interval: 1, cap_gb: 1000}
lan_ports: [lan4, lan5]
lan_macaddr: "98:03:8e:71:9d:b9"
lan_address: 192.168.0.1/24
# Jio's billing cycle restarts on the 21st; usage counters roll over then.
router_cycle_day: 21
# Upstream DNS, over HTTPS so the ISPs neither see nor rewrite lookups. Each resolver gets a local
# https-dns-proxy instance on its port; bootstrap addresses resolve the resolver's own name at start.
doh_resolvers:
  - {url: "https://cloudflare-dns.com/dns-query", bootstrap: [1.1.1.1, 1.0.0.1], port: 5053}
  - {url: "https://dns.google/dns-query", bootstrap: [8.8.8.8, 8.8.4.4], port: 5054}
# Plain DNS for adblock: the bridge while dnsmasq restarts and the exempt devices.
dns_servers: [1.1.1.1]
track_ips: [1.1.1.1, 8.8.8.8, 9.9.9.9]
# Names whose public records point at tailnet addresses; dnsmasq's rebind protection drops them otherwise.
rebind_domains: ["mephisto.{{ domain }}"]
# A reservation with no device, outside the DHCP pool: verify.yml switches its ISP to test the switch end to end.
wanpref_probe: {mac: "02:00:00:00:00:fe", ip: 192.168.0.254}
dhcp_hosts: "{{ secrets.wol | combine(secrets.dhcp_hosts, {'wanpref-probe': wanpref_probe}) }}"
# Devices whose traffic prefers another ISP; the rest of `wans` stays as fallback in order. Keys are dhcp_hosts names.
wan_preferences:
  jio-stb: jio
# DNS ad blocking for the LAN. Exempt devices (dhcp_hosts names) get unfiltered plain DNS; the Jio box is the first
# candidate if its apps break, since they call Jio ad and analytics domains the list blocks. Allowlisted domains are
# never blocked.
router_adblock_exempt: []
router_adblock_allowlist: []

warden_init: procd
warden_uid: 200
warden_modules: [system, wake, wan, clients]
warden_disks: [/overlay]
warden_wakes: [devil]
warden_wifi_api: http://192.168.0.2/ubus
