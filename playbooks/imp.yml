- name: Generate imp site.h
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    octet: (25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])
  tasks:
    - name: Wake targets are well-formed
      ansible.builtin.assert:
        that:
          - hostvars[item].wol.mac is match('^([0-9a-f]{2}:){5}[0-9a-f]{2}$')
          - hostvars[item].wol.ip is match('^(' ~ octet ~ '\.){3}' ~ octet ~ '$')
        quiet: true
      loop: "{{ imp.wakes }}"

    - name: Write site.h
      ansible.builtin.template:
        src: imp-site.h.j2
        dest: "{{ imp.repo }}/site.h"
        mode: "0600"
      no_log: true
