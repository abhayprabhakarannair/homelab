- name: Verify platform
  hosts: platform
  become: true
  gather_facts: false
  vars:
    pub: podman exec mqtt mosquitto_pub -h 127.0.0.1 -p {{ mqtt.port }} -q 1
    sub: podman exec mqtt mosquitto_sub -h 127.0.0.1 -p {{ mqtt.port }} -C 1 -W 3
    probe: -i verify-probe -u probe -P {{ secrets.mqtt.probe }}
    console: -i verify-console -u console -P {{ secrets.mqtt.console }}
  tasks:
    - name: Gather service state
      ansible.builtin.service_facts:

    - name: Services are running
      ansible.builtin.assert:
        that: ansible_facts.services[item].state == 'running'
      loop: [mqtt.service, caddy.service]

    - name: Collect listening sockets
      ansible.builtin.command: ss -tlnH
      register: sockets
      changed_when: false

    - name: Broker is bound to localhost only, Caddy to the tailnet only
      ansible.builtin.assert:
        that:
          - listeners | select('search', ':' ~ mqtt.port ~ '$') | reject('match', '127\.0\.0\.1:') | list == []
          - listeners | select('search', ':' ~ mqtt.ws_port ~ '$') | reject('match', '127\.0\.0\.1:') | list == []
          - listeners | select('search', ':443$') | list | length > 0
          - listeners | select('search', ':443$') | reject('match', '100\.') | list == []
          - listeners | select('search', ':80$') | list == []
      vars:
        listeners: "{{ sockets.stdout_lines | map('split') | map(attribute=3) | list }}"

    - name: Anonymous clients are refused
      ansible.builtin.command: "{{ pub }} -i verify-anon -t {{ topic_root }}/probe/state -m x"
      register: result
      failed_when: result.rc == 0
      changed_when: false

    - name: Wrong passwords are refused
      ansible.builtin.command: "{{ pub }} -i verify-wrong -u probe -P wrong -t {{ topic_root }}/probe/state -m x"
      register: result
      failed_when: result.rc == 0
      changed_when: false

    - name: Probe publishes its own state
      ansible.builtin.command: "{{ pub }} {{ probe }} -r -t {{ topic_root }}/probe/state -m verify-own"
      changed_when: false
      no_log: true

    - name: Console reads it
      ansible.builtin.command: "{{ sub }} {{ console }} -t {{ topic_root }}/probe/state"
      register: result
      failed_when: result.stdout != 'verify-own'
      changed_when: false
      no_log: true

    - name: Probe writes into another device's topics
      ansible.builtin.command: "{{ pub }} {{ probe }} -r -t {{ topic_root }}/imp/meta -m verify-foreign"
      changed_when: false
      no_log: true

    - name: Console overwrites a device's state
      ansible.builtin.command: "{{ pub }} {{ console }} -r -t {{ topic_root }}/probe/state -m verify-ui"
      changed_when: false
      no_log: true

    - name: Neither write was accepted
      ansible.builtin.command: >-
        {{ sub }} {{ console }} -C 2 -t {{ topic_root }}/imp/meta -t {{ topic_root }}/probe/state
      register: result
      failed_when: "'verify-foreign' in result.stdout or 'verify-ui' in result.stdout"
      changed_when: false
      no_log: true

    - name: Probe cannot read another device's commands
      ansible.builtin.shell: |
        {{ sub }} {{ probe }} -t {{ topic_root }}/imp/cmd & reader=$!
        sleep 1
        {{ pub }} {{ console }} -t {{ topic_root }}/imp/cmd -m verify-cmd
        wait "$reader"
      register: result
      failed_when: "'verify-cmd' in result.stdout"
      changed_when: false
      no_log: true

    - name: Console can command a device
      ansible.builtin.shell: |
        {{ sub }} {{ probe }} -t {{ topic_root }}/probe/cmd & reader=$!
        sleep 1
        {{ pub }} {{ console }} -t {{ topic_root }}/probe/cmd -m verify-cmd
        wait "$reader"
      register: result
      failed_when: result.stdout != 'verify-cmd'
      changed_when: false
      no_log: true

    - name: Remove retained test messages
      ansible.builtin.command: "{{ pub }} {{ probe }} -r -n -t {{ topic_root }}/probe/state"
      changed_when: false
      no_log: true

    - name: Every warden host announces itself
      ansible.builtin.command: >-
        {{ sub }} {{ console }} -C 2 -t {{ topic_root }}/{{ item }}/status -t {{ topic_root }}/{{ item }}/meta
      loop: "{{ groups['wardens'] }}"
      register: wardens
      changed_when: false
      failed_when: >-
        wardens.stdout_lines | length != 2 or 'online' not in wardens.stdout_lines
        or (wardens.stdout_lines | reject('eq', 'online') | first | from_json).kind != 'warden'
      no_log: true

    - name: Console page is served over HTTPS
      ansible.builtin.uri:
        url: "https://console.{{ inventory_hostname }}.{{ domain }}/"
        return_content: true
      delegate_to: localhost
      become: false
      register: console_page
      failed_when: console_page.status != 200 or '<title>console</title>' not in console_page.content

    - name: Console assets are compressed and cached by kind
      ansible.builtin.uri:
        url: "https://console.{{ inventory_hostname }}.{{ domain }}/{{ item.path }}"
        headers:
          Accept-Encoding: zstd, gzip
        return_content: false
      loop:
        - {path: "", cache: "no-cache"}
        - {path: "{{ console_page.content | regex_search('vendor/mqtt-[^\"]+\\.js') }}", cache: immutable}
      loop_control:
        label: "{{ item.path or '/' }}"
      delegate_to: localhost
      become: false
      register: console_asset
      failed_when: >-
        console_asset.status != 200
        or console_asset.content_encoding | default('') not in ['zstd', 'gzip']
        or item.cache not in console_asset.cache_control | default('')

    - name: Console proxies the bus over WebSocket  # noqa: command-instead-of-module (uri cannot do an upgrade)
      ansible.builtin.command: >-
        curl -sS -o /dev/null -w '%{http_code}' --max-time 5 --http1.1
        -H 'Connection: Upgrade' -H 'Upgrade: websocket' -H 'Sec-WebSocket-Version: 13'
        -H 'Sec-WebSocket-Key: {{ lookup('ansible.builtin.password', '/dev/null', length=16) | b64encode }}'
        -H 'Sec-WebSocket-Protocol: mqtt'
        https://console.{{ inventory_hostname }}.{{ domain }}/mqtt
      delegate_to: localhost
      become: false
      register: console_ws
      changed_when: false
      failed_when: console_ws.stdout != '101'

    - name: Read tailnet name
      ansible.builtin.command: tailscale status --self --json
      register: status
      changed_when: false

    - name: Valid certificates on the tailnet site and the Funnel endpoint
      ansible.builtin.command:
        cmd: openssl s_client -brief -verify_return_error -servername {{ item.0 }} -connect {{ item.0 }}:{{ item.1 }}
        stdin: ""
      loop:
        - ["verify.{{ inventory_hostname }}.{{ domain }}", 443]
        - ["{{ tailnet_name }}", "{{ mqtt.funnel_port }}"]
      vars:
        tailnet_name: "{{ (status.stdout | from_json).Self.DNSName | regex_replace('\\.$', '') }}"
      delegate_to: localhost
      become: false
      register: tls
      changed_when: false
      failed_when: >-
        tls.rc != 0 or "Verification: OK" not in tls.stderr

- name: Verify access points
  hosts: access_points
  gather_facts: false
  tasks:
    - name: Read radio state
      ansible.builtin.raw: ubus call network.wireless status
      register: radios
      changed_when: false
      no_log: true

    - name: Both radios broadcast the home SSID
      ansible.builtin.assert:
        that:
          - state | length == 2
          - state | rejectattr('up') | list == []
          - state | map(attribute='interfaces') | flatten | map(attribute='config.ssid') | unique == [secrets.wifi.ssid]
        quiet: true
      vars:
        state: "{{ radios.stdout | from_json | dict2items | map(attribute='value') }}"
      no_log: true

    - name: No DHCP or router advertisement servers run
      ansible.builtin.raw: pgrep -l 'dnsmasq|odhcpd'
      register: servers
      changed_when: false
      failed_when: servers.rc == 0

    - name: Read clock
      ansible.builtin.raw: date +%s
      register: clock
      changed_when: false

    - name: Clock is synchronised
      ansible.builtin.assert:
        that: (clock.stdout | trim | int - now().timestamp() | int) | abs < 60
        quiet: true

- name: Verify routers
  hosts: routers
  gather_facts: false
  tasks:
    - name: Read failover state
      ansible.builtin.command: mwan3 interfaces
      register: mwan3
      changed_when: false

    - name: Read active policy
      ansible.builtin.command: mwan3 policies
      register: policies
      changed_when: false

    - name: At least one WAN is online and traffic uses the first of them
      ansible.builtin.assert:
        that:
          - online | length > 0
          - policies.stdout is search('failover:\\s+' ~ online[0] ~ ' \\(100%\\)')
        quiet: true
      vars:
        online: "{{ mwan3.stdout_lines | select('search', ' is online') | map('split') | map(attribute=1) | list }}"

    - name: Router resolves and reaches the internet
      ansible.builtin.command: "{{ item }}"
      loop:
        - nslookup one.one.one.one 127.0.0.1
        - ping -c1 -W2 1.1.1.1
      changed_when: false

    - name: Read DHCP config
      ansible.builtin.command: uci show dhcp
      register: dhcp
      changed_when: false

    - name: Every reservation is configured
      ansible.builtin.assert:
        that: (".mac='" ~ item.value.mac | lower ~ "'") in dhcp.stdout
        quiet: true
      loop: "{{ dhcp_hosts | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true

    - name: Read failover config
      ansible.builtin.command: uci show mwan3
      register: mwan3_config
      changed_when: false
      no_log: true

    - name: Every device preference has its rule and a policy that tries that ISP first
      ansible.builtin.assert:
        that:
          - ("mwan3.device_" ~ rule ~ ".src_ip='" ~ dhcp_hosts[item.key].ip ~ "'") in mwan3_config.stdout
          - ("mwan3.device_" ~ rule ~ ".use_policy='prefer_" ~ item.value ~ "'") in mwan3_config.stdout
          - ("mwan3.prefer_" ~ item.value ~ ".use_member='wan_" ~ item.value ~ "_m1'") in mwan3_config.stdout
        quiet: true
      vars:
        rule: "{{ item.key | replace('-', '_') }}"
      loop: "{{ wan_preferences | default({}) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true

    # OpenWrt's busybox has no su: drop to warden's uid in Python.
    - name: The ISP switch is callable by warden, refuses non-LAN addresses, and its overrides are readable
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import os, subprocess, sys
            os.setgid({{ warden_uid }})
            os.setuid({{ warden_uid }})
            request = '{"ip":"198.51.100.1","isp":"auto"}'
            code = subprocess.run(["ubus", "call", "wanpref", "set", request]).returncode
            if os.path.isdir("/tmp/wanpref"):
                for name in os.listdir("/tmp/wanpref"):
                    open(os.path.join("/tmp/wanpref", name)).read()
            sys.exit(code)
      register: wanpref
      changed_when: false
      failed_when: wanpref.rc != 0 or (wanpref.stdout | from_json).error != 'not a LAN address'

    - name: No IPv6 router advertisements
      ansible.builtin.command: pgrep odhcpd
      register: odhcpd
      changed_when: false
      failed_when: odhcpd.rc == 0

    - name: Report WANs that are down
      ansible.builtin.debug:
        msg: "{{ down | map('trim') | list }}"
      changed_when: down | length > 0
      vars:
        down: "{{ mwan3.stdout_lines | select('search', 'interface wan_') | reject('search', ' is online') | list }}"
