# The enumerator turns ups.conf sections into nut-driver@ units, so it runs before the driver restarts.
- name: Restart NUT
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop: [nut-driver-enumerator.service, nut-driver.target, nut-server.service, nut-monitor.service]
  when: not ansible_check_mode
