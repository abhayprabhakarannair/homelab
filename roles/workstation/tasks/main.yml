- name: Install ufw
  community.general.pacman:
    name: ufw
    state: present

- name: Default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    default: "{{ item.policy }}"
  loop:
    - {direction: incoming, policy: deny}
    - {direction: outgoing, policy: allow}
    - {direction: routed, policy: deny}

- name: Allowed services
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto }}"
    from_ip: "{{ item.from_ip | default('any') }}"
    comment: "{{ omit if absent else item.comment }}"
    delete: "{{ absent }}"
  vars:
    absent: "{{ item.state | default('present') == 'absent' }}"
  loop: "{{ ufw_rules }}"
  loop_control:
    label: "{{ item.comment }}"

- name: Read installed ufw rules
  ansible.builtin.slurp:
    src: /etc/ufw/user.rules
  register: workstation_ufw_user_rules

- name: Remove app-profile rules superseded by ufw_rules
  community.general.ufw:
    rule: allow
    name: "{{ item }}"
    delete: true
  loop: "{{ ufw_superseded_apps | default([]) }}"
  when: ("dapp_" ~ (item | urlencode)) in (workstation_ufw_user_rules.content | b64decode)

- name: Enforce ufw
  community.general.ufw:
    state: enabled

- name: Start ufw at boot
  ansible.builtin.systemd_service:
    name: ufw.service
    enabled: true
    state: started
