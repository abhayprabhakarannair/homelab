- name: Config directory
  ansible.builtin.file:
    path: "{{ miniflux_dir }}"
    state: directory
    mode: "0700"

- name: Database and admin credentials
  ansible.builtin.template:
    src: env.j2
    dest: "{{ miniflux_dir }}/env"
    mode: "0600"
  no_log: true
  notify: Restart miniflux

- name: Quadlet
  ansible.builtin.template:
    src: miniflux.container.j2
    dest: /etc/containers/systemd/miniflux.container
    mode: "0644"
  notify: Restart miniflux

- name: Apply pending changes
  ansible.builtin.meta: flush_handlers

- name: Miniflux running
  ansible.builtin.systemd_service:
    name: miniflux.service
    state: started
    daemon_reload: true
  when: not ansible_check_mode
