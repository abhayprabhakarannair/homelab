- name: Config directory
  ansible.builtin.file:
    path: /etc/homelab/caddy
    state: directory
    mode: "0750"
    setype: container_file_t

- name: Containerfile
  ansible.builtin.template:
    src: Containerfile.j2
    dest: /etc/homelab/caddy/Containerfile
    mode: "0644"
  register: caddy_containerfile

- name: Image build unit
  ansible.builtin.template:
    src: caddy.build.j2
    dest: /etc/containers/systemd/caddy.build
    mode: "0644"
  register: caddy_build_unit
  notify: Reload systemd

- name: Load the build unit
  ansible.builtin.meta: flush_handlers

- name: Build image
  ansible.builtin.systemd_service:
    name: caddy-build.service
    state: "{{ 'restarted' if caddy_containerfile.changed or caddy_build_unit.changed else 'started' }}"
  when: not ansible_check_mode

- name: Cloudflare credentials
  ansible.builtin.template:
    src: env.j2
    dest: /etc/homelab/caddy/env
    mode: "0600"
  no_log: true
  notify: Restart caddy

- name: Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/homelab/caddy/Caddyfile
    mode: "0644"
    setype: container_file_t
    validate: >-
      podman run --rm --network none -e CLOUDFLARE_API_TOKEN=validate
      -v %s:/etc/caddy/Caddyfile:ro,Z {{ caddy_image }}
      caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
  notify: Restart caddy

- name: Container unit
  ansible.builtin.template:
    src: caddy.container.j2
    dest: /etc/containers/systemd/caddy.container
    mode: "0644"
  notify: [Reload systemd, Restart caddy]

- name: Apply pending changes
  ansible.builtin.meta: flush_handlers

- name: Caddy running
  ansible.builtin.systemd_service:
    name: caddy.service
    state: started
  when: not ansible_check_mode
