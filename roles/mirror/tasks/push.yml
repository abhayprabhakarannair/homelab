# Sends the files that differ from what was read, then makes every entry's type, owner, group and mode match.
- name: Collect changed files
  ansible.builtin.shell: |
    set -euo pipefail
    cd {{ mirror_copy.work | quote }}
    changed=()
    while read -r mode path; do
      [ -f ".$path" ] || continue
      cmp -s ".$path" "../base$path" && continue
      chmod "$mode" ".$path"
      changed+=(".$path")
    done <<'EOF'
    {% for e in mirror_copy.entries if e.dir is not defined %}
    {{ e.mode }} {{ e.path }}
    {% endfor %}
    EOF
    if [ -n "${changed[*]-}" ]; then
      tar -c --owner=0 --group=0 --numeric-owner -f - "${changed[@]}" | gzip -9n | base64 -w0
    fi
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  register: mirror_payload
  changed_when: false
  check_mode: false
  no_log: true

# One shell argument is capped at 128 KiB.
- name: Send changed files
  ansible.builtin.raw: >-
    umask 077 && printf %s {{ mirror_payload.stdout[item : item + 65536] }}
    {{ '>' if item == 0 else '>>' }} /tmp/mirror.b64
  loop: "{{ range(0, mirror_payload.stdout | length, 65536) | list }}"
  changed_when: false
  no_log: true

- name: Install changed files, fix ownership and modes
  ansible.builtin.raw: |
    check={{ ansible_check_mode | int }}
    fix() {
      [ -n "$(find "$5" -maxdepth 0 -type "$1" -perm "$2" -user "$3" -group "$4" 2>/dev/null)" ] && return
      echo "$5"
      [ "$check" = 1 ] && return
      if [ "$1" = d ]; then mkdir -p "$5" || exit 1; fi
      chown "$3:$4" "$5" && chmod "$2" "$5" || exit 1
    }
    {% for e in mirror_copy.entries if e.dir is defined %}
    fix d {{ e.mode }} {{ e.owner | default('root') }} {{ e.group | default('root') }} {{ e.path | quote }}
    {% endfor %}
    {% if mirror_payload.stdout and not ansible_check_mode %}
    python3 -m base64 -d /tmp/mirror.b64 | tar -xzf - -C / || exit 1
    rm /tmp/mirror.b64
    {% endif %}
    {% for e in mirror_copy.entries if e.dir is not defined %}
    fix f {{ e.mode }} {{ e.owner | default('root') }} {{ e.group | default('root') }} {{ e.path | quote }}
    {% endfor %}
  register: mirror_fixed
  changed_when: mirror_fixed.stdout | trim | length > 0
  check_mode: false

- name: Remove the mirror
  ansible.builtin.file:
    path: "{{ mirror_copy.root }}"
    state: absent
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false
