- name: Tailnet zone
  ansible.posix.firewalld:
    zone: tailnet
    state: present
    permanent: true
  register: firewall_zone
  notify: Reload firewalld

- name: Activate new zones
  ansible.builtin.meta: flush_handlers

- name: Tailnet interface in the tailnet zone
  ansible.posix.firewalld:
    zone: tailnet
    interface: tailscale0
    state: enabled
    permanent: true
    immediate: true
  when: not (ansible_check_mode and firewall_zone is changed)

- name: HTTPS from the tailnet
  ansible.posix.firewalld:
    zone: tailnet
    service: https
    state: enabled
    permanent: true
    immediate: true
  when: not (ansible_check_mode and firewall_zone is changed)
