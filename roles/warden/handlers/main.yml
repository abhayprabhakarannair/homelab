- name: Restart warden
  ansible.builtin.systemd_service:
    name: warden.service
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode and warden_init == 'systemd'
  listen: Restart warden

- name: Restart warden under procd
  ansible.builtin.raw: /etc/init.d/warden restart
  changed_when: true
  when: not ansible_check_mode and warden_init == 'procd'
  listen: Restart warden
