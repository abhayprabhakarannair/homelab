- name: Unpack warden
  ansible.builtin.shell: rm -rf /opt/warden/warden && tar -xzf /opt/warden/warden.tar.gz -C /opt/warden
  changed_when: true
  notify: Restart warden

- name: Restart warden
  ansible.builtin.systemd_service:
    name: warden.service
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode and warden_init == 'systemd'
  listen: Restart warden

- name: Restart warden under procd
  ansible.builtin.command: /etc/init.d/warden restart
  changed_when: true
  when: not ansible_check_mode and warden_init == 'procd'
  listen: Restart warden
