warden_init_files:
  systemd:
    - {src: 50-warden.rules.j2, path: /etc/polkit-1/rules.d/50-warden.rules, mode: "0644"}
    - {src: warden.service.j2, path: /etc/systemd/system/warden.service, mode: "0644"}
  procd:
    - {src: warden.init.j2, path: /etc/init.d/warden, mode: "0755"}
warden_files: >-
  {{ [{'path': '/opt/warden', 'mode': '0755', 'dir': true},
      {'path': '/opt/warden/warden.tar.gz', 'mode': '0644'},
      {'path': '/etc/warden', 'mode': '0750', 'group': 'warden', 'dir': true},
      {'path': '/etc/warden/password', 'mode': '0640', 'group': 'warden'},
      {'path': '/etc/warden/env', 'mode': '0640', 'group': 'warden'}]
     + ([{'path': '/etc/warden/wifi-password', 'mode': '0640', 'group': 'warden'}]
        if warden_wifi_api is defined else [])
     + warden_init_files[warden_init] | map('ansible.utils.remove_keys', target=['src']) | list }}
