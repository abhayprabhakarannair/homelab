- name: Runtime dependency and service user
  ansible.builtin.include_tasks: "{{ warden_init }}-prereqs.yml"

# One reproducible archive per commit: its checksum says whether the code changed, and unpacking it
# into an emptied directory drops files that left the repo.
- name: Archive the committed warden tree
  ansible.builtin.shell: |
    set -euo pipefail
    mkdir -p "$(dirname "{{ warden_archive }}")"
    git -C "{{ warden.repo }}" -c tar.umask=022 archive --format=tar.gz -o "{{ warden_archive }}" HEAD warden
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false

- name: Read managed files
  ansible.builtin.include_role:
    name: mirror
    tasks_from: pull
  vars:
    mirror_entries: "{{ warden_files }}"

- name: Code archive
  ansible.builtin.copy:
    src: "{{ warden_archive }}"
    dest: "{{ mirror_copy.work }}/opt/warden/warden.tar.gz"
    mode: "0644"
  delegate_to: localhost
  become: false

- name: MQTT password
  ansible.builtin.copy:
    dest: "{{ mirror_copy.work }}/etc/warden/password"
    content: "{{ secrets.mqtt[inventory_hostname] }}\n"
    mode: "0640"
  delegate_to: localhost
  become: false
  no_log: true
  notify: Restart warden

- name: Access point API password
  ansible.builtin.copy:
    dest: "{{ mirror_copy.work }}/etc/warden/wifi-password"
    content: "{{ secrets.ap_api.password }}\n"
    mode: "0640"
  delegate_to: localhost
  become: false
  when: warden_wifi_api is defined
  no_log: true
  notify: Restart warden

- name: Environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ mirror_copy.work }}/etc/warden/env"
    mode: "0640"
  delegate_to: localhost
  become: false
  notify: Restart warden

- name: Service definition
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ mirror_copy.work }}{{ item.path }}"
    mode: "{{ item.mode }}"
  loop: "{{ warden_init_files[warden_init] }}"
  loop_control:
    label: "{{ item.path }}"
  delegate_to: localhost
  become: false
  notify: Restart warden

- name: Write managed files
  ansible.builtin.include_role:
    name: mirror
    tasks_from: push

# Converges on its own: the marker holds the checksum of the archive last unpacked successfully, so a
# failed or interrupted unpack, or a deleted tree, is redone on the next run. The new tree is swapped in by rename.
- name: Code
  ansible.builtin.raw: |
    set -e
    cd /opt/warden
    sum=$(sha256sum warden.tar.gz)
    sum=${sum%% *}
    if [ -d warden ] && [ "$(cat .unpacked 2>/dev/null)" = "$sum" ]; then exit 0; fi
    rm -rf .new .old
    mkdir .new
    tar -xzf warden.tar.gz -C .new
    if [ -d warden ]; then mv warden .old; fi
    mv .new/warden warden
    rm -rf .new .old
    echo "$sum" > .unpacked
    echo unpacked
  register: warden_unpack
  changed_when: "'unpacked' in warden_unpack.stdout"
  notify: Restart warden

- name: Service
  ansible.builtin.include_tasks: "{{ warden_init }}-service.yml"
