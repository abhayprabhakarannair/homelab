- name: Runtime dependency and service user
  ansible.builtin.include_tasks: "{{ warden_init }}-prereqs.yml"

- name: Code root
  ansible.builtin.file:
    path: /opt/warden
    state: directory
    owner: root
    group: root
    mode: "0755"

# One reproducible archive per commit: its checksum says whether the code changed, and unpacking it
# into an emptied directory drops files that left the repo.
- name: Archive the committed warden tree
  ansible.builtin.shell: |
    set -euo pipefail
    mkdir -p "$(dirname "{{ warden_archive }}")"
    git -C "{{ warden.repo }}" -c tar.umask=022 archive --format=tar.gz -o "{{ warden_archive }}" HEAD warden
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false

- name: Code archive
  ansible.builtin.copy:
    src: "{{ warden_archive }}"
    dest: /opt/warden/warden.tar.gz
    owner: root
    group: root
    mode: "0644"

# Converges on its own: the marker holds the checksum of the archive last unpacked successfully, so a
# failed or interrupted unpack, or a deleted tree, is redone on the next run. The new tree is swapped in by rename.
- name: Code
  ansible.builtin.shell: |
    set -e
    cd /opt/warden
    sum=$(sha256sum warden.tar.gz)
    sum=${sum%% *}
    if [ -d warden ] && [ "$(cat .unpacked 2>/dev/null)" = "$sum" ]; then exit 0; fi
    rm -rf .new .old
    mkdir .new
    tar -xzf warden.tar.gz -C .new
    if [ -d warden ]; then mv warden .old; fi
    mv .new/warden warden
    rm -rf .new .old
    echo "$sum" > .unpacked
    echo unpacked
  register: warden_unpack
  changed_when: "'unpacked' in warden_unpack.stdout"
  notify: Restart warden

- name: Config directory
  ansible.builtin.file:
    path: /etc/warden
    state: directory
    owner: root
    group: warden
    mode: "0750"

- name: MQTT password
  ansible.builtin.copy:
    dest: /etc/warden/password
    content: "{{ secrets.mqtt[inventory_hostname] }}\n"
    owner: root
    group: warden
    mode: "0640"
  no_log: true
  notify: Restart warden

- name: Environment
  ansible.builtin.template:
    src: env.j2
    dest: /etc/warden/env
    owner: root
    group: warden
    mode: "0640"
  notify: Restart warden

- name: Service
  ansible.builtin.include_tasks: "{{ warden_init }}-service.yml"
