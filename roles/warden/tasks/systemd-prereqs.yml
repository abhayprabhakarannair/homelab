- name: Runtime dependency
  community.general.pacman:
    name: python-paho-mqtt
    state: present

- name: System group
  ansible.builtin.group:
    name: warden
    system: true

- name: System user
  ansible.builtin.user:
    name: warden
    group: warden
    system: true
    shell: /usr/bin/nologin
    home: /
    create_home: false
