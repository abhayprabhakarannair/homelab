- name: Apply pending changes
  ansible.builtin.meta: flush_handlers

- name: Running and enabled
  ansible.builtin.raw: |
    /etc/init.d/warden enabled || { /etc/init.d/warden enable && echo enabled; }
    /etc/init.d/warden running || { /etc/init.d/warden start && echo started; }
  register: warden_service
  changed_when: warden_service.stdout | trim | length > 0
