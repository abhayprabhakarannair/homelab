- name: Apply router config
  ansible.builtin.include_tasks: apply.yml

- name: Restart vnstat
  ansible.builtin.raw: /etc/init.d/vnstat restart
  changed_when: true

# rpcd discovers exec plugins at start; ubusd reads ACL files on SIGHUP.
- name: Reload ubus services
  ansible.builtin.raw: /etc/init.d/rpcd restart && kill -HUP "$(pidof ubusd)"
  changed_when: true

- name: Sync ISP overrides
  ansible.builtin.raw: /usr/libexec/wanpref-sync
  changed_when: true

# restart rebuilds the blocklist from the feed copies in RAM and reloads the exemptions; only reload downloads.
# The init script refuses while a run is in progress (the package starts one on install, cron and WAN events too).
- name: Restart adblock
  ansible.builtin.raw: |
    for _ in $(seq 60); do /etc/init.d/adblock running || break; sleep 5; done
    /etc/init.d/adblock restart
  changed_when: true
