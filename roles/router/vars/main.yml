router_configs: [system, network, dhcp, firewall, mwan3, vnstat, sqm]
router_scripts:
  - {src: wanpref-sync.j2, path: /usr/libexec/wanpref-sync, mode: "0755"}
  - {src: wanpref.j2, path: /usr/libexec/rpcd/wanpref, mode: "0755"}
  - {src: mwan3.user.j2, path: /etc/mwan3.user, mode: "0755"}
  - {src: warden-acl.json.j2, path: /usr/share/acl.d/warden.json, mode: "0644"}
# Read by sysupgrade and by owut (upgrade.yml), so an upgrade keeps the files above and the services stay off.
router_upgrade_files:
  - {src: upgrade-keep.j2, path: /lib/upgrade/keep.d/homelab-router, mode: "0644"}
  - {src: upgrade-init.j2, path: /etc/owut.d/homelab-init.sh, mode: "0644"}
router_services_off: [odhcpd]
# On OpenWrt /var is RAM: the usage database lives on flash so cycle totals survive reboots. vnstatd does not
# create its database directory.
router_files: >-
  {{ [{'path': '/etc/vnstat', 'mode': '0755', 'dir': true},
      {'path': '/usr/libexec/rpcd', 'mode': '0755', 'dir': true},
      {'path': '/etc/vnstat.conf', 'mode': '0644'}]
     + router_configs | map('regex_replace', '^', '/etc/config/') | map('community.general.dict_kv', 'path')
       | map('combine', {'mode': '0644'}) | list
     + (router_scripts + router_upgrade_files) | map('ansible.utils.remove_keys', target=['src']) | list }}
