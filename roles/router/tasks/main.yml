# Runs even in check mode. Only applying config and handlers use Python modules; the rest is raw
# (each Python module costs ~9 s here). Reinstalled after each OpenWrt upgrade.
- name: Install Python
  ansible.builtin.raw: command -v python3 >/dev/null || { apk update && apk add python3; }
  register: router_python
  changed_when: "'OK:' in router_python.stdout"
  check_mode: false

- name: Install packages
  ansible.builtin.raw: |
    for p in mwan3:/usr/sbin/mwan3 vnstat2:/usr/sbin/vnstatd conntrack:/usr/sbin/conntrack; do
      [ -e "${p#*:}" ] && continue
      echo "${p%%:*}"
      {{ ':' if ansible_check_mode else 'apk add "${p%%:*}" >/dev/null || exit 1' }}
    done
  register: router_packages
  changed_when: router_packages.stdout | trim | length > 0
  check_mode: false

- name: Read managed files
  ansible.builtin.include_role:
    name: mirror
    tasks_from: pull
  vars:
    mirror_entries: "{{ router_files }}"

- name: Write config
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ mirror_copy.work }}/etc/config/{{ item }}"
    mode: "0644"
  loop: "{{ router_configs }}"
  delegate_to: localhost
  notify: Apply router config

- name: Usage counter settings
  ansible.builtin.lineinfile:
    path: "{{ mirror_copy.work }}/etc/vnstat.conf"
    regexp: "^;?{{ item.key }} "
    line: "{{ item.key }} {{ item.value }}"
  loop:
    - {key: DatabaseDir, value: '"/etc/vnstat"'}
    - {key: MonthRotate, value: "{{ router_cycle_day }}"}
  loop_control:
    label: "{{ item.key }}"
  delegate_to: localhost
  when: not (ansible_check_mode and router_packages is changed)
  notify: Restart vnstat

- name: ISP override helper
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ mirror_copy.work }}{{ item.path }}"
    mode: "{{ item.mode }}"
  loop: "{{ router_scripts }}"
  loop_control:
    label: "{{ item.path }}"
  delegate_to: localhost
  notify:
    - Reload ubus services
    - Sync ISP overrides

- name: Upgrade keep list and first-boot script
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ mirror_copy.work }}{{ item.path }}"
    mode: "{{ item.mode }}"
  loop: "{{ router_upgrade_files }}"
  loop_control:
    label: "{{ item.path }}"
  delegate_to: localhost

- name: Snapshot config for rollback
  ansible.builtin.raw: mkdir -p /tmp/config.rollback && cp -a /etc/config/. /tmp/config.rollback/
  changed_when: false

- name: Write managed files
  ansible.builtin.include_role:
    name: mirror
    tasks_from: push

# Converges after a run that failed between writing and applying: reload_config records the applied state of each
# config in /var/run/config.md5, so anything that differs from it is still waiting to be applied.
- name: Find config written but not applied
  ansible.builtin.raw: |
    for f in {{ router_configs | join(' ') }}; do
      applied=$(grep " /var/run/config.check/$f$" /var/run/config.md5 | cut -d' ' -f1)
      current=$(uci show "$f" 2>/dev/null | md5sum | cut -d' ' -f1)
      [ "$applied" = "$current" ] || echo "$f"
    done
  register: router_pending
  changed_when: router_pending.stdout | trim | length > 0
  check_mode: false
  notify: Apply router config

- name: Service state
  ansible.builtin.raw: |
    check={{ ansible_check_mode | int }}
    want() {
      if [ "$2" = on ]; then
        /etc/init.d/$1 enabled || { echo "$1 enable"; [ "$check" = 1 ] || /etc/init.d/$1 enable; }
        /etc/init.d/$1 running || { echo "$1 start"; [ "$check" = 1 ] || /etc/init.d/$1 start; }
      else
        /etc/init.d/$1 enabled && { echo "$1 disable"; [ "$check" = 1 ] || /etc/init.d/$1 disable; }
        /etc/init.d/$1 running && { echo "$1 stop"; [ "$check" = 1 ] || /etc/init.d/$1 stop; }
      fi
      return 0
    }
    {% for s in router_services_off %}
    want {{ s }} off
    {% endfor %}
    want mwan3 on
  register: router_services
  changed_when: router_services.stdout | trim | length > 0
  check_mode: false
  when: not (ansible_check_mode and router_packages is changed)
