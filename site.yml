- name: Platform
  hosts: platform
  become: true
  roles:
    - firewall
    - podman
    - mqtt
    - funnel
    - dns
    - console
    - caddy

- name: Workstations
  hosts: workstations
  become: true
  roles:
    - workstation

- name: Routers
  hosts: routers
  gather_facts: false
  roles:
    - router

- name: Access points
  hosts: access_points
  gather_facts: false
  roles:
    - ap

- name: Wardens
  hosts: wardens
  become: true
  roles:
    - warden
