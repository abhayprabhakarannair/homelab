- name: Platform
  hosts: platform
  become: true
  roles:
    - firewall
    - podman
    - mqtt
    - funnel
    - dns
    - console
    - caddy

- name: Workstations
  hosts: workstations
  become: true
  roles:
    - workstation

- name: Wardens
  hosts: wardens
  become: true
  roles:
    - warden
