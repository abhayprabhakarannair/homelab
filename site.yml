- name: Platform
  hosts: platform
  become: true
  roles:
    - tailnet
    - firewall
    - podman
    - mqtt
    - funnel
    - dns
    - certs
    - postgres
    - miniflux
    - console
    - caddy

- name: Routers
  hosts: routers
  gather_facts: false
  roles:
    - router

- name: Access points
  hosts: access_points
  gather_facts: false
  roles:
    - ap

- name: Wardens
  hosts: wardens
  gather_facts: false
  roles:
    - warden
