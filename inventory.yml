all:
  children:
    platform:
      hosts:
        mephisto:
          ansible_become_password: "{{ secrets.become.mephisto }}"
    workstations:
      hosts:
        devil:
          ansible_host: devil.tail6aa22b.ts.net
          ansible_connection: "{{ 'local' if lookup('ansible.builtin.pipe', 'hostname -s') == 'devil' else 'ssh' }}"
          # With a terminal, sudo there adds an OSC 3008 sequence to raw output, which the mirror role parses.
          ansible_ssh_use_tty: false
          ansible_python_interpreter: /usr/bin/python3
          ansible_become_password: "{{ secrets.become.devil }}"
    wardens:
      hosts:
        devil:
        er605:
    routers:
      hosts:
        er605:
          ansible_host: 192.168.0.1
          ansible_user: root
          ansible_python_interpreter: /usr/bin/python3
          ansible_ssh_transfer_method: piped
          ansible_become: false
    access_points:
      hosts:
        eap225:
          ansible_host: 192.168.0.2
          ansible_user: root
