domain: iamabhay.fyi
lan_cidr: 192.168.0.0/24
lan_broadcast: 192.168.0.255
tailnet_cidr: 100.64.0.0/10
topic_root: home

mqtt:
  port: 1883
  ws_port: 9001
  funnel_port: 8443
  funnel_host: mephisto.tail6aa22b.ts.net
  devices: [devil, er605, probe]
  ui: [console]

images:
  mosquitto: docker.io/library/eclipse-mosquitto:2.1.4-alpine
  caddy: docker.io/library/caddy:2.11.9
  caddy_builder: docker.io/library/caddy:2.11.9-builder
  caddy_dns_cloudflare: github.com/caddy-dns/cloudflare@v0.2.4
  lego: docker.io/goacme/lego:v5.7.0
  postgres: docker.io/library/postgres:18.7-trixie
  miniflux: docker.io/miniflux/miniflux:2.3.5-distroless

postgres:
  port: 5432
  max_connections: 100
  shared_buffers: 1GB
  apps:
    miniflux: {conn_limit: 25}

miniflux:
  port: 8080
  admin: admin
  batch_size: 200  # feeds refreshed per hourly poll; above the feed count, so every feed is checked hourly

warden:
  repo: "{{ lookup('env', 'HOME') }}/Projects/warden"

console:
  repo: "{{ lookup('env', 'HOME') }}/Projects/console"
